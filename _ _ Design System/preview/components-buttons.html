<!DOCTYPE html><html><head><meta charset="UTF-8">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
body { font-family: 'Inter', sans-serif; background: #fff; padding: 18px; }
.row { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; margin-bottom: 12px; }
.label { font-size: 0.62rem; font-weight: 700; color: #94a3b8; text-transform: uppercase; letter-spacing: 0.06em; margin-bottom: 6px; }
.btn { padding: 9px 16px; border: none; border-radius: 8px; cursor: pointer; font-weight: 600; font-size: 0.875rem; font-family: inherit; display: inline-flex; align-items: center; gap: 6px; }
.btn-lg { padding: 12px 24px; font-size: 1rem; }
.btn-sm { padding: 6px 12px; font-size: 0.8rem; }
.primary  { background: #4f46e5; color: #fff; }
.primary-dark { background: #3730a3; color: #fff; box-shadow: 0 4px 12px rgba(79,70,229,.35); }
.danger   { background: #fff; color: #dc2626; border: 1px solid #fca5a5; }
.danger-h { background: #fee2e2; color: #dc2626; border: 1px solid #dc2626; }
.success  { background: #059669; color: #fff; }
.secondary{ background: #f1f5f9; color: #0f172a; border: 1px solid #e2e8f0; }
.outline  { background: rgba(255,255,255,.12); border: 1px solid rgba(255,255,255,.25); color: rgba(255,255,255,.9); font-family: inherit; font-weight: 500; font-size: 0.82rem; padding: 6px 14px; border-radius: 8px; cursor: pointer; }
.header-wrap { background: linear-gradient(135deg, #3730a3, #4f46e5, #6366f1); border-radius: 8px; padding: 10px 14px; display: inline-flex; gap: 8px; }
</style></head><body>
<div class="label">Primary</div>
<div class="row">
  <button class="btn primary">Хадгалах</button>
  <button class="btn primary-dark">Hover state</button>
  <button class="btn btn-lg primary">Нэвтрэх</button>
  <button class="btn btn-sm primary">Нэмэх</button>
</div>
<div class="label">Secondary & Danger</div>
<div class="row">
  <button class="btn secondary">Буцах</button>
  <button class="btn danger">Устгах</button>
  <button class="btn danger-h">Hover state</button>
  <button class="btn success">Хэвлэх</button>
</div>
<div class="label">On dark header</div>
<div class="row">
  <div class="header-wrap">
    <button class="outline">Гарах</button>
  </div>
</div>
</body></html>

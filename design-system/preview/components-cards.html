<!DOCTYPE html><html><head><meta charset="UTF-8">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
body { font-family: 'Inter', sans-serif; background: #f1f5f9; padding: 18px; }
.row { display: flex; gap: 14px; }
/* Stat card */
.stat-card { background: #fff; border-radius: 12px; padding: 20px; box-shadow: 0 1px 3px rgba(0,0,0,.08); display: flex; align-items: center; gap: 16px; flex: 1; }
.stat-icon { width: 48px; height: 48px; border-radius: 8px; display: flex; align-items: center; justify-content: center; flex-shrink: 0; }
.stat-value { font-size: 1.75rem; font-weight: 800; color: #0f172a; letter-spacing: -0.03em; line-height: 1; }
.stat-label { font-size: 0.8rem; color: #64748b; margin-top: 4px; font-weight: 500; }
/* Student card */
.student-card { background: #fff; border-radius: 12px; box-shadow: 0 1px 3px rgba(0,0,0,.08); overflow: hidden; flex: 1.2; }
.card-top-bar { height: 5px; background: linear-gradient(90deg, #4f46e5, #818cf8); }
.card-header { display: flex; justify-content: space-between; align-items: flex-start; padding: 18px 18px 10px; }
.card-name { font-size: 1.05rem; font-weight: 700; color: #0f172a; margin: 0; }
.card-class { font-size: 0.78rem; color: #64748b; margin-top: 2px; }
.badge { background: #e0e7ff; color: #4f46e5; padding: 4px 10px; border-radius: 9999px; font-size: 0.75rem; font-weight: 700; }
.score-val { font-weight: 800; font-size: 1.8rem; letter-spacing: -0.04em; color: #059669; }
.score-label { font-size: 0.8rem; color: #64748b; font-weight: 500; }
.card-body { padding: 4px 18px 14px; }
.card-actions { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; padding: 12px 18px 16px; border-top: 1px solid #e2e8f0; }
.btn { padding: 8px 12px; border: none; border-radius: 8px; cursor: pointer; font-weight: 600; font-size: 0.82rem; font-family: inherit; }
</style></head><body>
<div class="row">
  <div style="display:flex;flex-direction:column;gap:12px;flex:1">
    <div class="stat-card">
      <div class="stat-icon" style="background:#dbeafe">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#3b82f6" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/></svg>
      </div>
      <div>
        <div class="stat-value">142</div>
        <div class="stat-label">Нийт сурагч</div>
      </div>
    </div>
    <div class="stat-card">
      <div class="stat-icon" style="background:#d1fae5">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#059669" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><polyline points="14 9 14 3 10 3 10 9"/><path d="M4 3v4a8 8 0 0 0 16 0V3"/><line x1="12" y1="19" x2="12" y2="15"/><line x1="8" y1="22" x2="16" y2="22"/></svg>
      </div>
      <div>
        <div class="stat-value" style="color:#059669">78.4</div>
        <div class="stat-label">Дундаж оноо</div>
      </div>
    </div>
  </div>
  <div class="student-card">
    <div class="card-top-bar"></div>
    <div class="card-header">
      <div>
        <div class="card-name">Батбаяр Дорж</div>
        <div class="card-class">10-А анги · 2024-2025</div>
      </div>
      <span class="badge">87.2</span>
    </div>
    <div class="card-body">
      <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:8px">
        <span class="score-label">Дундаж оноо</span>
        <span class="score-val">87.2</span>
      </div>
      <span style="font-size:0.78rem;color:#64748b;background:#f1f5f9;display:inline-block;padding:3px 10px;border-radius:9999px">8 хичээл</span>
    </div>
    <div class="card-actions">
      <button class="btn" style="background:#4f46e5;color:#fff">Дэлгэрэнгүй</button>
      <button class="btn" style="background:#f1f5f9;color:#0f172a;border:1px solid #e2e8f0">Засах</button>
    </div>
  </div>
</div>
</body></html>

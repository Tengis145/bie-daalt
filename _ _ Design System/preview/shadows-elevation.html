<!DOCTYPE html><html><head><meta charset="UTF-8">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
body { font-family: 'Inter', sans-serif; background: #f1f5f9; padding: 18px; }
.row { display: flex; gap: 12px; flex-wrap: wrap; }
.card { background: #fff; border-radius: 12px; padding: 12px 16px; min-width: 100px; text-align: center; }
.name { font-size: 0.65rem; font-weight: 700; color: #64748b; text-transform: uppercase; letter-spacing: 0.04em; margin-bottom: 2px; }
.use  { font-size: 0.6rem; color: #94a3b8; }
</style></head><body>
<div class="row">
  <div class="card" style="box-shadow:0 1px 2px rgba(0,0,0,.06)">
    <div class="name">xs</div><div class="use">Subtle</div>
  </div>
  <div class="card" style="box-shadow:0 1px 3px rgba(0,0,0,.08),0 1px 2px rgba(0,0,0,.04)">
    <div class="name">sm</div><div class="use">Cards</div>
  </div>
  <div class="card" style="box-shadow:0 4px 6px -1px rgba(0,0,0,.08),0 2px 4px -2px rgba(0,0,0,.04)">
    <div class="name">md</div><div class="use">Hover</div>
  </div>
  <div class="card" style="box-shadow:0 10px 15px -3px rgba(0,0,0,.08),0 4px 6px -4px rgba(0,0,0,.04)">
    <div class="name">lg</div><div class="use">Modals</div>
  </div>
  <div class="card" style="box-shadow:0 20px 25px -5px rgba(0,0,0,.1),0 8px 10px -6px rgba(0,0,0,.04)">
    <div class="name">xl</div><div class="use">Auth</div>
  </div>
  <div class="card" style="box-shadow:0 4px 12px rgba(79,70,229,.35)">
    <div class="name">primary</div><div class="use">Btn hover</div>
  </div>
</div>
</body></html>

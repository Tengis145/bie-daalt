<!DOCTYPE html><html><head><meta charset="UTF-8">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
body { font-family: 'Inter', sans-serif; }
.header { background: linear-gradient(135deg, #3730a3 0%, #4f46e5 60%, #6366f1 100%); padding: 0; box-shadow: 0 4px 20px rgba(79,70,229,.35); }
.header-inner { max-width: 100%; padding: 0 24px; display: flex; justify-content: space-between; align-items: center; height: 64px; }
.logo { display: flex; align-items: center; gap: 12px; text-decoration: none; }
.logo-icon { width: 38px; height: 38px; background: rgba(255,255,255,.18); border-radius: 10px; display: flex; align-items: center; justify-content: center; }
.logo-title { font-size: 1rem; font-weight: 700; color: #fff; letter-spacing: -0.02em; }
.logo-sub { font-size: 0.72rem; color: rgba(255,255,255,.7); margin-top: 1px; }
.nav { display: flex; align-items: center; gap: 4px; }
.nav-link { color: rgba(255,255,255,.8); font-weight: 500; font-size: 0.875rem; padding: 8px 14px; border-radius: 8px; text-decoration: none; }
.nav-link.active { background: rgba(255,255,255,.22); color: #fff; }
.nav-divider { width: 1px; height: 24px; background: rgba(255,255,255,.25); margin: 0 8px; }
.user-badge { display: flex; align-items: center; gap: 8px; background: rgba(255,255,255,.15); border-radius: 50px; padding: 5px 14px 5px 6px; }
.user-avatar { width: 28px; height: 28px; background: rgba(255,255,255,.9); color: #4f46e5; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-weight: 700; font-size: 0.75rem; }
.user-name { color: #fff; font-size: 0.85rem; font-weight: 500; }
.btn-logout { background: rgba(255,255,255,.12); border: 1px solid rgba(255,255,255,.25); color: rgba(255,255,255,.9); padding: 6px 14px; border-radius: 8px; cursor: pointer; font-size: 0.82rem; font-weight: 500; font-family: inherit; }
</style></head><body>
<div class="header">
  <div class="header-inner">
    <a class="logo" href="#">
      <div class="logo-icon">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg>
      </div>
      <div>
        <div class="logo-title">БИЕ ДААЛТ</div>
        <div class="logo-sub">ЕБС Дүн бүртгэл</div>
      </div>
    </a>
    <nav class="nav">
      <a class="nav-link active" href="#">Хяналтын самбар</a>
      <a class="nav-link" href="#">Хичээлийн дүн</a>
      <a class="nav-link" href="#">Сурагч нэмэх</a>
      <div class="nav-divider"></div>
      <div class="user-badge">
        <div class="user-avatar">Б</div>
        <span class="user-name">Багш</span>
      </div>
      <button class="btn-logout">Гарах</button>
    </nav>
  </div>
</div>
</body></html>

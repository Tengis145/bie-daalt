<!DOCTYPE html>
<html lang="mn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>БИЕ ДААЛТ — Web App UI Kit</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>

<style>
  *, *::before, *::after { box-sizing: border-box; }
  body { margin: 0; font-family: 'Inter','Segoe UI',system-ui,sans-serif; background:#f1f5f9; color:#0f172a; font-size:15px; line-height:1.5; -webkit-font-smoothing:antialiased; }
  #root { min-height:100vh; display:flex; flex-direction:column; }
  input, select, button, textarea { font-family:inherit; }

  @keyframes shimmer {
    0%   { background-position: -200% 0; }
    100% { background-position:  200% 0; }
  }
  @keyframes slideUp {
    from { transform:translateY(16px); opacity:0; }
    to   { transform:none; opacity:1; }
  }

  /* ── Responsive ── */
  @media (max-width: 900px) {
    .stats-grid { grid-template-columns: repeat(2,1fr) !important; }
    .detail-grid { grid-template-columns: 1fr !important; }
    .subject-detail-body { grid-template-columns: 1fr !important; }
  }
  @media (max-width: 640px) {
    .desktop-nav { display:none !important; }
    .hamburger   { display:flex !important; }
    .mobile-menu-open { display:block !important; }
    .stats-grid  { grid-template-columns: 1fr 1fr !important; gap:10px !important; }
    .student-grid { grid-template-columns: 1fr !important; }
    .main-content { padding:0 14px !important; margin-top:18px !important; }
  }

  /* ── Print styles ── */
  .print-report { display:none; }
  @media print {
    body * { visibility:hidden; }
    .print-report, .print-report * { visibility:visible; }
    .print-report {
      display:block !important;
      position:fixed; inset:0;
      padding:28px 36px;
      font-family:'Times New Roman', serif;
      color:#000; background:#fff;
      font-size:13px;
    }
    .print-school { text-align:center; font-size:1rem; font-weight:700; letter-spacing:0.06em; margin-bottom:3px; }
    .print-title  { text-align:center; font-size:1.3rem; font-weight:900; margin-bottom:18px; letter-spacing:0.08em; }
    .print-meta   { display:grid; grid-template-columns:1fr 1fr; gap:5px 24px; margin-bottom:18px; font-size:0.85rem; }
    .print-table  { width:100%; border-collapse:collapse; font-size:0.82rem; margin-bottom:24px; }
    .print-table th, .print-table td { border:1px solid #000; padding:5px 8px; text-align:center; }
    .print-table th { background:#eee; font-weight:700; }
    .print-table td:nth-child(2) { text-align:left; }
    .print-footer { display:flex; justify-content:space-between; margin-top:28px; font-size:0.82rem; gap:20px; }
    .print-sign   { flex:1; }
    .no-print, .hero-print-hide { display:none !important; }
  }
</style>
</head>
<body>
<div id="root"></div>

<script type="text/babel" src="Data.jsx"></script>
<script type="text/babel" src="Components.jsx"></script>
<script type="text/babel" src="Dashboard.jsx"></script>
<script type="text/babel" src="StudentDetail.jsx"></script>
<script type="text/babel" src="Login.jsx"></script>
<script type="text/babel" src="SubjectDashboard.jsx"></script>

<script type="text/babel">
const { useState } = React;

function MobileHeader({ currentPage, onNavigate, user, open, setOpen }) {
  const navItems = [
    { id:'dashboard', label:'Хяналтын самбар' },
    { id:'subjects',  label:'Хичээлийн дүн'   },
    { id:'add',       label:'Сурагч нэмэх'     },
  ];
  return (
    <div style={{ background:'linear-gradient(135deg,#3730a3 0%,#4f46e5 60%,#6366f1 100%)', boxShadow:'0 4px 20px rgba(79,70,229,.35)', position:'sticky', top:0, zIndex:100 }}>
      <div style={{ padding:'0 16px', display:'flex', justifyContent:'space-between', alignItems:'center', height:60 }}>
        <div style={{ display:'flex', alignItems:'center', gap:10 }}>
          <div style={{ width:34, height:34, background:'rgba(255,255,255,.18)', borderRadius:9, display:'flex', alignItems:'center', justifyContent:'center' }}>
            <SchoolIcon size={18} color="white"/>
          </div>
          <div>
            <div style={{ fontSize:'0.95rem', fontWeight:700, color:'#fff', letterSpacing:'-0.02em' }}>БИЕ ДААЛТ</div>
            <div style={{ fontSize:'0.66rem', color:'rgba(255,255,255,.65)' }}>ЕБС Дүн бүртгэл</div>
          </div>
        </div>
        <div style={{ display:'flex', alignItems:'center', gap:8 }}>
          {/* Desktop nav */}
          <nav className="desktop-nav" style={{ display:'flex', alignItems:'center', gap:4 }}>
            {navItems.map(n => (
              <button key={n.id} onClick={()=>onNavigate(n.id)}
                style={{ color: currentPage===n.id?'#fff':'rgba(255,255,255,.8)', fontWeight:500, fontSize:'0.875rem', padding:'7px 12px', borderRadius:8, border:'none', cursor:'pointer', background: currentPage===n.id?'rgba(255,255,255,.22)':'transparent', fontFamily:'inherit' }}>
                {n.label}
              </button>
            ))}
            <div style={{ width:1, height:22, background:'rgba(255,255,255,.25)', margin:'0 6px' }}></div>
            <div style={{ display:'flex', alignItems:'center', gap:7, background:'rgba(255,255,255,.15)', borderRadius:50, padding:'4px 12px 4px 5px' }}>
              <div style={{ width:26, height:26, background:'rgba(255,255,255,.9)', color:'#4f46e5', borderRadius:'50%', display:'flex', alignItems:'center', justifyContent:'center', fontWeight:700, fontSize:'0.72rem' }}>{user.charAt(0)}</div>
              <span style={{ color:'#fff', fontSize:'0.82rem', fontWeight:500 }}>{user}</span>
            </div>
            <button onClick={()=>onNavigate('login')} style={{ background:'rgba(255,255,255,.12)', border:'1px solid rgba(255,255,255,.25)', color:'rgba(255,255,255,.9)', padding:'5px 12px', borderRadius:8, cursor:'pointer', fontSize:'0.8rem', fontWeight:500, fontFamily:'inherit', display:'inline-flex', alignItems:'center', gap:5 }}>
              <LogoutIcon size={13} color="currentColor"/> Гарах
            </button>
          </nav>
          {/* Hamburger */}
          <button className="hamburger" onClick={()=>setOpen(!open)}
            style={{ display:'none', flexDirection:'column', justifyContent:'center', gap:5, background:'rgba(255,255,255,.12)', border:'1px solid rgba(255,255,255,.25)', borderRadius:8, width:38, height:38, cursor:'pointer', padding:'0 8px' }}>
            <span style={{ display:'block', height:2, background:'white', borderRadius:2, transition:'all .2s', transform: open?'translateY(7px) rotate(45deg)':'none' }}></span>
            <span style={{ display:'block', height:2, background:'white', borderRadius:2, transition:'all .2s', opacity: open?0:1 }}></span>
            <span style={{ display:'block', height:2, background:'white', borderRadius:2, transition:'all .2s', transform: open?'translateY(-7px) rotate(-45deg)':'none' }}></span>
          </button>
        </div>
      </div>
      {/* Mobile menu */}
      {open && (
        <div className="mobile-menu-open" style={{ background:'rgba(55,48,163,.97)', backdropFilter:'blur(8px)', padding:'8px 12px 16px', borderTop:'1px solid rgba(255,255,255,.15)' }}>
          {navItems.map(n => (
            <button key={n.id} onClick={()=>{onNavigate(n.id);setOpen(false);}}
              style={{ display:'flex', alignItems:'center', width:'100%', color: currentPage===n.id?'#fff':'rgba(255,255,255,.85)', fontWeight:500, fontSize:'0.95rem', padding:'11px 14px', borderRadius:8, border:'none', cursor:'pointer', background: currentPage===n.id?'rgba(255,255,255,.18)':'transparent', fontFamily:'inherit', marginBottom:2 }}>
              {n.label}
            </button>
          ))}
          <div style={{ height:1, background:'rgba(255,255,255,.2)', margin:'8px 0' }}></div>
          <div style={{ display:'flex', justifyContent:'space-between', alignItems:'center', padding:'6px 14px 0' }}>
            <span style={{ color:'rgba(255,255,255,.8)', fontSize:'0.85rem' }}>{user}</span>
            <button onClick={()=>onNavigate('login')} style={{ background:'rgba(255,255,255,.12)', border:'1px solid rgba(255,255,255,.25)', color:'rgba(255,255,255,.9)', padding:'5px 12px', borderRadius:8, cursor:'pointer', fontSize:'0.8rem', fontFamily:'inherit' }}>Гарах</button>
          </div>
        </div>
      )}
    </div>
  );
}

function AddStudent({ onNavigate }) {
  const subjects = ['Математик','Монгол хэл','Физик','Хими','Англи хэл','Биологи','Газарзүй','Түүх'];
  const [name, setName] = useState('');
  const [cls,  setCls]  = useState('10-А');
  const [saved, setSaved] = useState(false);

  function handleSave(e) {
    e.preventDefault();
    setSaved(true);
    setTimeout(() => onNavigate('dashboard'), 1200);
  }

  const inputSt = { width:'100%', padding:'10px 14px', border:`1.5px solid ${C.border}`, borderRadius:8, fontSize:'0.95rem', fontFamily:'inherit', color:C.text, background:C.surface, boxSizing:'border-box', outline:'none' };
  const labelSt = { display:'block', marginBottom:6, fontWeight:600, fontSize:'0.875rem', color:C.text };
  const exInSt  = { width:64, padding:'6px 8px', fontSize:'0.875rem', textAlign:'center', border:`1.5px solid ${C.border}`, borderRadius:8, fontFamily:'inherit', color:C.text, background:C.surface, outline:'none', boxSizing:'border-box' };

  const GradeRow = ({ subj }) => {
    const [e1,setE1]   = useState('');
    const [e2,setE2]   = useState('');
    const [att,setAtt] = useState('');
    const [ind,setInd] = useState('');
    const total = (parseInt(e1)||0)+(parseInt(e2)||0)+(parseInt(att)||0)+(parseInt(ind)||0);
    const grade = total > 0 ? getLetterGrade(total) : null;
    const gs    = grade ? LETTER_STYLE[grade] : null;
    return (
      <tr style={{ background: gs ? gs.rowBg : 'transparent' }}>
        <td style={{ padding:'9px 12px', borderBottom:`1px solid ${C.border}`, fontWeight:600, fontSize:'0.875rem', color:C.text }}>{subj}</td>
        <td style={{ padding:'6px 8px', borderBottom:`1px solid ${C.border}`, textAlign:'center' }}><input type="number" min="0" max="30" value={e1} onChange={e=>setE1(e.target.value)} style={exInSt} placeholder="0"/></td>
        <td style={{ padding:'6px 8px', borderBottom:`1px solid ${C.border}`, textAlign:'center' }}><input type="number" min="0" max="30" value={e2} onChange={e=>setE2(e.target.value)} style={exInSt} placeholder="0"/></td>
        <td style={{ padding:'6px 8px', borderBottom:`1px solid ${C.border}`, textAlign:'center' }}><input type="number" min="0" max="20" value={att} onChange={e=>setAtt(e.target.value)} style={exInSt} placeholder="0"/></td>
        <td style={{ padding:'6px 8px', borderBottom:`1px solid ${C.border}`, textAlign:'center' }}><input type="number" min="0" max="20" value={ind} onChange={e=>setInd(e.target.value)} style={exInSt} placeholder="0"/></td>
        <td style={{ padding:'6px 8px', borderBottom:`1px solid ${C.border}`, textAlign:'center' }}>
          {gs ? <span style={{ padding:'3px 10px', borderRadius:9999, fontWeight:700, fontSize:'0.8rem', background:gs.bg, color:gs.color }}>{grade} · {total}</span>
              : <span style={{ color:C.textFaint, fontSize:'0.8rem' }}>—</span>}
        </td>
      </tr>
    );
  };

  return (
    <div style={{ maxWidth:860, margin:'28px auto', padding:'0 24px' }}>
      <div style={{ marginBottom:24 }}>
        <h1 style={{ margin:'0 0 4px', fontSize:'1.6rem', fontWeight:800, letterSpacing:'-0.03em' }}>Сурагч нэмэх</h1>
        <p style={{ margin:0, color:C.textMuted, fontSize:'0.9rem' }}>Шинэ сурагчийн мэдээлэл болон дүнг бүртгэнэ</p>
      </div>
      {saved && <div style={{ background:'#ecfdf5', color:'#065f46', border:'1px solid #6ee7b7', padding:'12px 16px', borderRadius:8, marginBottom:20, fontSize:'0.875rem', fontWeight:500 }}>✓ Сурагч амжилттай нэмэгдлээ! Жагсаалт руу буцаж байна...</div>}
      <form onSubmit={handleSave}>
        <div style={{ background:C.surface, borderRadius:16, padding:'26px 30px', boxShadow:'0 4px 6px -1px rgba(0,0,0,.08)', marginBottom:18 }}>
          <div style={{ fontSize:'0.875rem', fontWeight:700, color:C.textMuted, textTransform:'uppercase', letterSpacing:'0.06em', marginBottom:16, paddingBottom:10, borderBottom:`1px solid ${C.border}` }}>ҮНДСЭН МЭДЭЭЛЭЛ</div>
          <div style={{ display:'grid', gridTemplateColumns:'1fr 1fr', gap:18, marginBottom:4 }}>
            <div><label style={labelSt}>Сурагчийн нэр</label><input value={name} onChange={e=>setName(e.target.value)} placeholder="Бүтэн нэрийг оруулна уу" style={inputSt} required/></div>
            <div><label style={labelSt}>Анги</label><select value={cls} onChange={e=>setCls(e.target.value)} style={inputSt}>{['10-А','10-Б','11-А','11-Б','12-А','12-Б'].map(c=><option key={c} value={c}>{c} анги</option>)}</select></div>
            <div><label style={labelSt}>Хичээлийн жил</label><select style={inputSt}><option>2024-2025</option><option>2023-2024</option></select></div>
            <div><label style={labelSt}>Улирал</label><select style={inputSt}><option>1-р улирал</option><option>2-р улирал</option></select></div>
            <div><label style={labelSt}>Gmail <span style={{ color:C.textFaint, fontWeight:400 }}>(заавал биш)</span></label><input type="email" placeholder="suraguud@gmail.com" style={inputSt}/></div>
          </div>
        </div>
        <div style={{ background:C.surface, borderRadius:16, padding:'26px 30px', boxShadow:'0 4px 6px -1px rgba(0,0,0,.08)', marginBottom:18, overflowX:'auto' }}>
          <div style={{ fontSize:'0.875rem', fontWeight:700, color:C.textMuted, textTransform:'uppercase', letterSpacing:'0.06em', marginBottom:16, paddingBottom:10, borderBottom:`1px solid ${C.border}` }}>ХИЧЭЭЛИЙН ДҮН</div>
          <table style={{ width:'100%', borderCollapse:'collapse', minWidth:520 }}>
            <thead>
              <tr style={{ background:C.bg }}>
                <th style={{ padding:'9px 12px', fontSize:'0.75rem', fontWeight:700, color:C.textMuted, textTransform:'uppercase', letterSpacing:'0.05em', borderBottom:`2px solid ${C.border}`, textAlign:'left' }}>Хичээл</th>
                {[['Ш1','30'],['Ш2','30'],['Ирц','20'],['БД','20'],['Нийт','100']].map(([l,m])=>(
                  <th key={l} style={{ padding:'9px 8px', fontSize:'0.72rem', fontWeight:700, color:C.textMuted, textTransform:'uppercase', borderBottom:`2px solid ${C.border}`, textAlign:'center' }}>{l}<br/><span style={{ fontSize:'0.6rem', color:C.textFaint, fontWeight:400 }}>/{m}</span></th>
                ))}
              </tr>
            </thead>
            <tbody>{subjects.map(s => <GradeRow key={s} subj={s}/>)}</tbody>
          </table>
        </div>
        <div style={{ display:'flex', justifyContent:'flex-end', gap:12 }}>
          <Btn variant="secondary" onClick={()=>onNavigate('dashboard')}><ArrowLeftIcon size={15} color={C.textMuted}/> Буцах</Btn>
          <Btn variant="primary" size="lg">Хадгалах</Btn>
        </div>
      </form>
    </div>
  );
}

function App() {
  const [page, setPage]                   = useState('login');
  const [user, setUser]                   = useState('');
  const [selectedStudent, setSelectedStudent] = useState(null);
  const [menuOpen, setMenuOpen]           = useState(false);

  function handleLogin(username) { setUser(username); setPage('dashboard'); }
  function handleNavigate(p)     { setSelectedStudent(null); setPage(p); setMenuOpen(false); }
  function handleSelectStudent(s){ setSelectedStudent(s); setPage('detail'); }

  if (page === 'login') return <Login onLogin={handleLogin}/>;

  return (
    <div style={{ minHeight:'100vh', display:'flex', flexDirection:'column', background:C.bg }}>
      <MobileHeader currentPage={page} onNavigate={handleNavigate} user={user} open={menuOpen} setOpen={setMenuOpen}/>
      <div style={{ flex:1 }}>
        {page === 'dashboard' && <Dashboard onNavigate={handleNavigate} onSelectStudent={handleSelectStudent}/>}
        {page === 'detail'    && selectedStudent && <StudentDetail student={selectedStudent} onBack={()=>setPage('dashboard')}/>}
        {page === 'add'       && <AddStudent onNavigate={handleNavigate}/>}
        {page === 'subjects'  && <SubjectDashboard onSelectStudent={handleSelectStudent}/>}
      </div>
      <footer className="no-print" style={{ textAlign:'center', padding:18, color:C.textMuted, fontSize:'0.8rem', borderTop:`1px solid ${C.border}`, background:C.surface }}>
        © 2025 БИЕ ДААЛТ · ЕБС Сурагчдын дүн бүртгэлийн систем
      </footer>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>
</body>
</html>

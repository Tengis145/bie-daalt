<!DOCTYPE html><html><head><meta charset="UTF-8">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
body { font-family: 'Inter', sans-serif; background: #fff; padding: 18px; }
.section { margin-bottom: 14px; }
.label { font-size: 0.62rem; font-weight: 700; color: #94a3b8; text-transform: uppercase; letter-spacing: 0.06em; margin-bottom: 8px; }
.row { display: flex; align-items: center; gap: 10px; margin-bottom: 4px; }
.bar { background: #4f46e5; height: 8px; border-radius: 4px; }
.txt { font-size: 0.65rem; color: #64748b; font-weight: 600; width: 80px; }
.radii { display: flex; gap: 10px; }
.rd { display: flex; flex-direction: column; align-items: center; gap: 6px; }
.rd-box { width: 40px; height: 40px; background: #eef2ff; border: 2px solid #4f46e5; }
.rd-lbl { font-size: 0.6rem; font-weight: 600; color: #4f46e5; text-align: center; }
</style></head><body>
<div class="section">
  <div class="label">Spacing Scale</div>
  <div class="row"><div class="bar" style="width:4px"></div><div class="txt">4px — space-1</div></div>
  <div class="row"><div class="bar" style="width:8px"></div><div class="txt">8px — space-2</div></div>
  <div class="row"><div class="bar" style="width:12px"></div><div class="txt">12px — space-3</div></div>
  <div class="row"><div class="bar" style="width:16px"></div><div class="txt">16px — space-4</div></div>
  <div class="row"><div class="bar" style="width:20px"></div><div class="txt">20px — space-5</div></div>
  <div class="row"><div class="bar" style="width:24px"></div><div class="txt">24px — space-6</div></div>
  <div class="row"><div class="bar" style="width:28px"></div><div class="txt">28px — space-7</div></div>
  <div class="row"><div class="bar" style="width:40px"></div><div class="txt">40px — space-10</div></div>
</div>
<div class="section">
  <div class="label">Border Radius</div>
  <div class="radii">
    <div class="rd"><div class="rd-box" style="border-radius:8px"></div><div class="rd-lbl">8px<br>--radius</div></div>
    <div class="rd"><div class="rd-box" style="border-radius:12px"></div><div class="rd-lbl">12px<br>--radius-lg</div></div>
    <div class="rd"><div class="rd-box" style="border-radius:16px"></div><div class="rd-lbl">16px<br>--radius-xl</div></div>
    <div class="rd"><div class="rd-box" style="border-radius:24px"></div><div class="rd-lbl">24px<br>--radius-2xl</div></div>
    <div class="rd"><div class="rd-box" style="border-radius:9999px"></div><div class="rd-lbl">pill<br>badges</div></div>
  </div>
</div>
</body></html>

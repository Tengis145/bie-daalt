<!DOCTYPE html><html><head><meta charset="UTF-8">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
body { font-family: 'Inter', sans-serif; background: #f1f5f9; padding: 20px; }
.row { display: flex; gap: 8px; margin-bottom: 10px; }
.swatch { flex: 1; height: 52px; border-radius: 8px; display: flex; align-items: flex-end; padding: 6px 8px; }
.swatch span { font-size: 0.65rem; font-weight: 600; opacity: 0.85; }
.label { font-size: 0.65rem; font-weight: 700; color: #64748b; text-transform: uppercase; letter-spacing: 0.06em; margin-bottom: 6px; }
.hex { font-size: 0.6rem; font-weight: 500; margin-top: 1px; opacity: 0.7; }
</style></head><body>
<div class="label">Primary — Indigo</div>
<div class="row">
  <div class="swatch" style="background:#1e1b4b"><span style="color:#fff">deeper<div class="hex">#1e1b4b</div></span></div>
  <div class="swatch" style="background:#312e81"><span style="color:#fff">900<div class="hex">#312e81</div></span></div>
  <div class="swatch" style="background:#3730a3"><span style="color:#fff">dark<div class="hex">#3730a3</div></span></div>
  <div class="swatch" style="background:#4f46e5"><span style="color:#fff">primary<div class="hex">#4f46e5</div></span></div>
  <div class="swatch" style="background:#6366f1"><span style="color:#fff">mid<div class="hex">#6366f1</div></span></div>
  <div class="swatch" style="background:#818cf8"><span style="color:#fff">400<div class="hex">#818cf8</div></span></div>
  <div class="swatch" style="background:#e0e7ff"><span style="color:#3730a3">light<div class="hex">#e0e7ff</div></span></div>
  <div class="swatch" style="background:#eef2ff; border:1px solid #e0e7ff"><span style="color:#3730a3">bg<div class="hex">#eef2ff</div></span></div>
</div>
<div class="label">Neutrals</div>
<div class="row">
  <div class="swatch" style="background:#0f172a"><span style="color:#fff">text<div class="hex">#0f172a</div></span></div>
  <div class="swatch" style="background:#334155"><span style="color:#fff">secondary<div class="hex">#334155</div></span></div>
  <div class="swatch" style="background:#64748b"><span style="color:#fff">muted<div class="hex">#64748b</div></span></div>
  <div class="swatch" style="background:#94a3b8"><span style="color:#fff">faint<div class="hex">#94a3b8</div></span></div>
  <div class="swatch" style="background:#e2e8f0"><span style="color:#475569">border<div class="hex">#e2e8f0</div></span></div>
  <div class="swatch" style="background:#f1f5f9; border:1px solid #e2e8f0"><span style="color:#475569">bg<div class="hex">#f1f5f9</div></span></div>
  <div class="swatch" style="background:#ffffff; border:1px solid #e2e8f0"><span style="color:#475569">surface<div class="hex">#fff</div></span></div>
</div>
</body></html>

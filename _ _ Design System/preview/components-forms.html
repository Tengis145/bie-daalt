<!DOCTYPE html><html><head><meta charset="UTF-8">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
body { font-family: 'Inter', sans-serif; background: #fff; padding: 18px; }
.label { font-size: 0.62rem; font-weight: 700; color: #94a3b8; text-transform: uppercase; letter-spacing: 0.06em; margin-bottom: 8px; }
.row { display: flex; gap: 12px; margin-bottom: 10px; flex-wrap: wrap; }
.group { display: flex; flex-direction: column; gap: 5px; flex: 1; min-width: 120px; }
.group label { font-size: 0.875rem; font-weight: 600; color: #0f172a; }
input, select { padding: 10px 14px; border: 1.5px solid #e2e8f0; border-radius: 8px; font-size: 0.95rem; font-family: inherit; color: #0f172a; background: #fff; width: 100%; }
.focused { border-color: #4f46e5; box-shadow: 0 0 0 3px rgba(79,70,229,.12); outline: none; }
.error-input { border-color: #dc2626; }
.search { padding: 8px 32px 8px 34px; border: 1.5px solid #e2e8f0; border-radius: 8px; font-size: 0.875rem; font-family: inherit; width: 100%; color: #0f172a; }
.search-wrap { position: relative; }
.search-icon { position: absolute; left: 10px; top: 50%; transform: translateY(-50%); }
</style></head><body>
<div class="label">Text Inputs</div>
<div class="row">
  <div class="group">
    <label>Сурагчийн нэр</label>
    <input type="text" placeholder="Нэрийг оруулна уу" value="">
  </div>
  <div class="group">
    <label>Нэвтрэх нэр</label>
    <input type="text" class="focused" value="batbayar@gmail.com">
  </div>
  <div class="group">
    <label>Анги <span style="color:#dc2626">*</span></label>
    <input type="text" class="error-input" placeholder="10-А" value="">
  </div>
</div>
<div class="label">Select & Search</div>
<div class="row">
  <div class="group">
    <label>Анги сонгох</label>
    <select><option>10-А анги</option><option>10-Б анги</option><option>11-А анги</option></select>
  </div>
  <div class="group">
    <label>Хайлт</label>
    <div class="search-wrap">
      <svg class="search-icon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#94a3b8" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
      <input class="search" type="text" placeholder="Сурагч хайх...">
    </div>
  </div>
  <div class="group">
    <label>Шалгалт 1 <span style="color:#94a3b8;font-weight:400;font-size:0.78rem">/30</span></label>
    <input type="number" placeholder="0" style="text-align:center">
  </div>
</div>
</body></html>

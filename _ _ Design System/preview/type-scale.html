<!DOCTYPE html><html><head><meta charset="UTF-8">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
body { font-family: 'Inter', sans-serif; background: #fff; padding: 20px; color: #0f172a; }
.row { display: flex; align-items: baseline; gap: 14px; padding: 8px 0; border-bottom: 1px solid #f1f5f9; }
.row:last-child { border-bottom: none; }
.meta { font-size: 0.62rem; font-weight: 600; color: #94a3b8; width: 96px; flex-shrink: 0; text-transform: uppercase; letter-spacing: 0.04em; padding-top: 2px; }
.sample { flex: 1; }
</style></head><body>
<div class="row">
  <div class="meta">hero / 900</div>
  <div class="sample" style="font-size:2.8rem;font-weight:900;letter-spacing:-0.04em;line-height:1">87.4</div>
</div>
<div class="row">
  <div class="meta">h1 / 800</div>
  <div class="sample" style="font-size:1.6rem;font-weight:800;letter-spacing:-0.03em">Хяналтын самбар</div>
</div>
<div class="row">
  <div class="meta">h2 / 800</div>
  <div class="sample" style="font-size:1.4rem;font-weight:800;letter-spacing:-0.03em">Сурагч нэмэх</div>
</div>
<div class="row">
  <div class="meta">h3 / 700</div>
  <div class="sample" style="font-size:1rem;font-weight:700">Хичээлийн дүн</div>
</div>
<div class="row">
  <div class="meta">stat / 800</div>
  <div class="sample" style="font-size:1.75rem;font-weight:800;letter-spacing:-0.03em;color:#4f46e5">142</div>
</div>
<div class="row">
  <div class="meta">body / 400</div>
  <div class="sample" style="font-size:15px;font-weight:400;color:#0f172a">Нийт сурагчдын тоо болон дундаж оноог харуулна.</div>
</div>
<div class="row">
  <div class="meta">label / 700 caps</div>
  <div class="sample" style="font-size:0.875rem;font-weight:700;text-transform:uppercase;letter-spacing:0.06em;color:#64748b">ХИЧЭЭЛИЙН НЭР</div>
</div>
<div class="row">
  <div class="meta">muted / 500</div>

<div class="row">

</body></html>
